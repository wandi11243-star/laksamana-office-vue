# Disabled in the GitHub UI (Actions minutes): `gh workflow enable ci.yml` turns it
# back on. Everything it checks still has to pass locally before pushing:
# `npm run lint && npm run typecheck && npm run build`.
name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: for s in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(k => k.startsWith('uji:')).join(' '))"); do npm run "$s" || exit 1; done
        env:
          STRICT: 1
