server {
  listen 80;
  root /usr/share/nginx/html;

  # Relative redirects (/login → /login/): behind Dokploy's Traefik the container only
  # sees plain HTTP on port 80, so an absolute Location would send the browser to http:// on the wrong port.
  absolute_redirect off;

  # The entry JS + CSS are ~1.3 MB raw, ~0.36 MB gzipped (text/html is always on the list).
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Hashed build assets never change.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Build id Nuxt polls to detect a new deploy; must never be cached.
  location /_nuxt/builds/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The service worker and manifest must always be re-checked, or updates stall.
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    # .webmanifest is not in nginx's default mime.types (served as octet-stream); .js keep their type.
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: unknown paths render the app shell. `$uri/index.html` instead of `$uri/`
  # serves /konten/planning directly, without a 301 to /konten/planning/.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html /200.html;
  }
}
