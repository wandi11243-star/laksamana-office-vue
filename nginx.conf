server {
  listen 80;
  root /usr/share/nginx/html;

  # Relative redirects (/login → /login/): behind Dokploy's Traefik the container only
  # sees plain HTTP on port 80, so an absolute Location would send the browser to http:// on the wrong port.
  absolute_redirect off;

  # Hashed build assets never change.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must always be re-checked, or updates stall.
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: unknown paths render the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /200.html;
  }
}
